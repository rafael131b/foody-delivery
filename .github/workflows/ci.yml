name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run backend tests
        working-directory: backend
        run: chmod +x mvnw && ./mvnw -B spotless:check test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Check frontend formatting
        working-directory: frontend
        run: npm run format:check
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  end-to-end:
    name: End-to-end browser test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_PATH: ${{ runner.temp }}/foody-e2e.db
      JWT_SECRET: foody-e2e-test-secret-for-disposable-ci-only
      E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start the API
        working-directory: backend
        run: |
          chmod +x mvnw
          nohup setsid ./mvnw -B spring-boot:run > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"
      - name: Start the frontend
        working-directory: frontend
        run: |
          nohup setsid npm run dev -- --host 127.0.0.1 --port 3000 --strictPort > "$RUNNER_TEMP/frontend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/frontend.pid"
      - name: Wait for the API to become ready
        run: |
          for attempt in $(seq 1 60); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/orders || true)
            if [ "$status" -ge 200 ] && [ "$status" -lt 500 ]; then
              echo "API is responding with HTTP $status"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/backend.log"
          echo "API did not become ready in time"
          exit 1
      - name: Wait for the frontend to become ready
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become ready in time"
          exit 1
      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Show process logs on failure
        if: failure()
        run: |
          for service in backend frontend; do
            echo "::group::$service logs"
            cat "$RUNNER_TEMP/$service.log" 2>/dev/null || true
            echo "::endgroup::"
          done
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop the test processes and remove the disposable database
        if: always()
        run: |
          for service in frontend backend; do
            if [ -f "$RUNNER_TEMP/$service.pid" ]; then
              pid=$(cat "$RUNNER_TEMP/$service.pid")
              kill -- "-$pid" 2>/dev/null || true
            fi
          done
          rm -f "$DB_PATH" "$DB_PATH-wal" "$DB_PATH-shm" "$DB_PATH-journal"
