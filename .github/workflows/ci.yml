name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run backend tests
        working-directory: backend
        run: chmod +x mvnw && ./mvnw -B spotless:check test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Check frontend formatting
        working-directory: frontend
        run: npm run format:check
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Compose build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build service images
        run: docker compose -f infra/docker-compose.yml build

  end-to-end:
    name: End-to-end browser test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright
        working-directory: frontend
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start the Docker Compose stack
        run: docker compose -p foody-e2e -f infra/docker-compose.yml up --build -d
      - name: Wait for the API to become ready
        run: |
          for attempt in $(seq 1 60); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/orders || true)
            if [ "$status" -ge 200 ] && [ "$status" -lt 500 ]; then
              echo "API is responding with HTTP $status"
              exit 0
            fi
            sleep 2
          done
          docker compose -p foody-e2e -f infra/docker-compose.yml logs backend
          echo "API did not become ready in time"
          exit 1
      - name: Run end-to-end tests
        working-directory: frontend
        run: npx playwright test --config=playwright.config.js
      - name: Show Docker logs on failure
        if: failure()
        run: docker compose -p foody-e2e -f infra/docker-compose.yml logs
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop the test stack and remove its disposable database
        if: always()
        run: docker compose -p foody-e2e -f infra/docker-compose.yml down -v
